version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project-backend
    env_file:
      - ./.env
    volumes:
      # 이미지는 S3에서 직접 읽으므로 로컬 볼륨이 필요 없다.
      # 캡션/임베딩 캐시(json)만 git·docker 빌드 컨텍스트에서 제외되어 있어 런타임에 마운트한다.
      - ./backend/app/imageRag/embeddings_cache.json:/app/app/imageRag/embeddings_cache.json
    depends_on:
      - redis
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: project-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    expose:
      - "6379"
    networks:
      - app-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: project-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge